<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TYMAA</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101816;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f2e6c8}
body{touch-action:none}

#game{
position:fixed;inset:0;
background:
linear-gradient(rgba(13,23,19,.08),rgba(13,23,19,.25)),
linear-gradient(160deg,#77945c 0 34%,#436d79 34% 64%,#718b54 64%);
overflow:hidden;
}

.river{
position:absolute;
width:145%;
height:31%;
left:-22%;
top:37%;
transform:rotate(-8deg);
background:linear-gradient(180deg,#527f89,#285966 55%,#16424e);
box-shadow:inset 0 8px 20px rgba(255,255,255,.14);
}

.wave{
position:absolute;
height:2px;
background:rgba(224,239,232,.28);
border-radius:50%;
animation:water 4s linear infinite;
}
@keyframes water{from{transform:translateX(-40px)}to{transform:translateX(80px)}}

.tree{
position:absolute;width:18px;height:34px;
background:#253e29;
clip-path:polygon(50% 0,100% 65%,72% 63%,100% 100%,0 100%,28% 63%,0 65%);
filter:drop-shadow(3px 5px 3px rgba(0,0,0,.25))
}

.urasa{
position:absolute;left:7%;bottom:15%;
width:100px;height:92px;
background:linear-gradient(100deg,#9a8057,#d0b987);
clip-path:polygon(50% 0,93% 88%,80% 100%,20% 100%,7% 88%);
filter:drop-shadow(8px 10px 8px rgba(0,0,0,.35))
}
.urasa:after{
content:"";position:absolute;
width:22px;height:34px;left:39px;bottom:0;background:#30271d
}

.serge{
position:absolute;left:22%;bottom:20%;width:8px;height:92px;background:#563c24
}
.serge:before{
content:"";position:absolute;left:-19px;top:18px;width:46px;height:5px;background:#563c24
}

.ore{
position:absolute;right:12%;top:27%;
width:52px;height:42px;
background:linear-gradient(135deg,#c08d4b,#745338);
clip-path:polygon(10% 75%,26% 22%,58% 6%,95% 55%,78% 100%,32% 92%);
filter:drop-shadow(0 0 12px rgba(237,192,95,.6));
animation:pulse 1.8s ease-in-out infinite
}
@keyframes pulse{50%{filter:drop-shadow(0 0 22px rgba(255,207,101,.95))}}

.person{
position:absolute;left:27%;bottom:20%;
width:16px;height:31px;background:#2d2119;border-radius:8px 8px 3px 3px;
transition:all .9s linear;
z-index:8
}
.person:before{
content:"";position:absolute;width:11px;height:11px;border-radius:50%;
background:#b98a62;top:-8px;left:2px
}

.node{
position:absolute;width:27px;height:27px;border-radius:50%;
border:2px solid rgba(249,218,144,.85);
background:rgba(82,58,30,.55);
box-shadow:0 0 0 6px rgba(244,202,108,.08);
z-index:20
}

#n1{left:31%;top:54%}
#n2{left:42%;top:51%}
#n3{left:52%;top:48%}
#n4{left:62%;top:45%}
#n5{left:71%;top:42%}

.beam{
position:absolute;
height:13px;
background:linear-gradient(#8b623b,#5f3d22);
border-radius:8px;
transform-origin:0 50%;
z-index:15;
box-shadow:0 4px 5px rgba(0,0,0,.4)
}
.beam:after{
content:"";position:absolute;left:4px;right:4px;top:3px;height:2px;background:rgba(236,193,128,.25)
}

.topbar{
position:absolute;left:0;right:0;top:0;height:76px;
padding:14px 16px;
display:flex;justify-content:space-between;align-items:start;
background:linear-gradient(rgba(9,15,13,.84),rgba(9,15,13,.25));
z-index:50
}
.logo{font-family:Georgia,serif;font-size:25px;letter-spacing:5px;color:#e2c07a}
.sub{font-size:10px;color:#c9b88f;margin-top:3px}

.resources{display:flex;gap:7px}
.res{
background:rgba(21,25,20,.72);
border:1px solid rgba(225,195,125,.2);
padding:7px 10px;border-radius:10px;font-size:12px
}

.mission{
position:absolute;left:15px;top:94px;
width:205px;padding:14px;
background:rgba(12,18,16,.76);
border:1px solid rgba(229,198,126,.2);
border-radius:13px;
z-index:50;
backdrop-filter:blur(7px)
}
.mission small{color:#daba72;letter-spacing:2px}
.mission b{display:block;font-size:14px;margin:7px 0;line-height:1.4}
.mission span{font-size:11px;color:#cbbd9f}

.toolbar{
position:absolute;left:50%;bottom:18px;
transform:translateX(-50%);
display:flex;gap:8px;z-index:50
}

button{
border:1px solid rgba(233,202,132,.22);
background:rgba(18,22,18,.88);
color:#eadcb9;
padding:12px 15px;border-radius:13px;
font-weight:700;font-size:12px
}
button.active,button.primary{
background:linear-gradient(#dfbd70,#aa7734);
color:#1b160f
}

#message{
position:absolute;left:50%;top:50%;
transform:translate(-50%,-50%) scale(.9);
background:rgba(9,15,13,.9);
border:1px solid rgba(231,199,126,.25);
padding:20px 26px;border-radius:17px;
font-weight:800;font-size:19px;text-align:center;
opacity:0;pointer-events:none;z-index:100;
transition:.3s
}
#message.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#message small{display:block;font-size:11px;color:#c8b995;font-weight:400;margin-top:7px}

.hint{
position:absolute;bottom:82px;left:50%;
transform:translateX(-50%);
background:rgba(9,15,13,.7);padding:8px 13px;border-radius:20px;
font-size:11px;z-index:50;white-space:nowrap
}
</style>
</head>

<body>
<div id="game">

<div class="river">
<div class="wave" style="left:10%;top:25%;width:120px"></div>
<div class="wave" style="left:38%;top:55%;width:160px;animation-delay:-2s"></div>
<div class="wave" style="left:67%;top:35%;width:100px;animation-delay:-1s"></div>
</div>

<div class="urasa"></div>
<div class="serge"></div>
<div class="ore"></div>
<div class="person" id="person"></div>

<div class="tree" style="left:3%;top:30%"></div>
<div class="tree" style="left:9%;top:23%"></div>
<div class="tree" style="right:4%;bottom:19%"></div>
<div class="tree" style="right:10%;bottom:13%"></div>
<div class="tree" style="right:18%;top:18%"></div>

<div class="node" id="n1"></div>
<div class="node" id="n2"></div>
<div class="node" id="n3"></div>
<div class="node" id="n4"></div>
<div class="node" id="n5"></div>

<div class="topbar">
<div>
<div class="logo">TYMAA</div>
<div class="sub">АЛАС · ЛЕТО · ДЕНЬ 1</div>
</div>

<div class="resources">
<div class="res">🪵 <b id="wood">6</b></div>
<div class="res">👥 8</div>
</div>
</div>

<div class="mission">
<small>ПЕРВАЯ ЦЕЛЬ</small>
<b>Доберись до рудного камня</b>
<span>Соедини опоры брёвнами и построй переправу.</span>
</div>

<div class="hint" id="hint">
Коснись одной опоры, затем другой
</div>

<div class="toolbar">
<button id="undo">↶</button>
<button id="reset">СБРОС</button>
<button class="primary" id="test">ИСПЫТАТЬ</button>
</div>

<div id="message">
<span id="msgTitle"></span>
<small id="msgText"></small>
</div>

</div>

<script>
const nodes=[...document.querySelectorAll(".node")]
let first=null
let beams=[]
let wood=6
let testing=false

function center(el){
 const r=el.getBoundingClientRect()
 return{x:r.left+r.width/2,y:r.top+r.height/2}
}

function connect(a,b){
 if(wood<=0)return
 if(beams.some(q=>(q.a===a&&q.b===b)||(q.a===b&&q.b===a)))return

 const A=center(a),B=center(b)
 const dx=B.x-A.x,dy=B.y-A.y
 const len=Math.hypot(dx,dy)

 if(len>190)return

 const beam=document.createElement("div")
 beam.className="beam"
 beam.style.left=A.x+"px"
 beam.style.top=(A.y-6)+"px"
 beam.style.width=len+"px"
 beam.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`
 document.getElementById("game").appendChild(beam)

 beams.push({a,b,beam})
 wood--
 document.getElementById("wood").textContent=wood
}

nodes.forEach(n=>{
 n.addEventListener("pointerdown",()=>{
  if(testing)return

  if(!first){
   first=n
   n.style.background="rgba(219,176,85,.9)"
   document.getElementById("hint").textContent="Теперь выбери вторую опору"
  }else{
   if(first!==n)connect(first,n)
   first.style.background=""
   first=null
   document.getElementById("hint").textContent="Продолжай строить или нажми ИСПЫТАТЬ"
  }
 })
})

document.getElementById("undo").onclick=()=>{
 if(testing||!beams.length)return
 const b=beams.pop()
 b.beam.remove()
 wood++
 document.getElementById("wood").textContent=wood
}

function clearBridge(){
 beams.forEach(b=>b.beam.remove())
 beams=[]
 wood=6
 document.getElementById("wood").textContent=wood
 first=null
 testing=false

 const p=document.getElementById("person")
 p.style.left="27%"
 p.style.bottom="20%"
 p.style.top=""
}

document.getElementById("reset").onclick=clearBridge

function hasPath(){
 const adj=new Map(nodes.map(n=>[n,[]]))

 beams.forEach(b=>{
  adj.get(b.a).push(b.b)
  adj.get(b.b).push(b.a)
 })

 const q=[nodes[0]]
 const seen=new Set([nodes[0]])

 while(q.length){
  const n=q.shift()
  if(n===nodes[4])return true

  adj.get(n).forEach(v=>{
   if(!seen.has(v)){
    seen.add(v)
    q.push(v)
   }
  })
 }
 return false
}

function show(title,text){
 const box=document.getElementById("message")
 document.getElementById("msgTitle").textContent=title
 document.getElementById("msgText").textContent=text
 box.classList.add("show")
 setTimeout(()=>box.classList.remove("show"),2200)
}

document.getElementById("test").onclick=()=>{
 if(testing)return
 testing=true

 if(!hasPath()){
  show("МОСТ НЕ ГОТОВ","Переправа должна соединить оба берега.")
  testing=false
  return
 }

 const p=document.getElementById("person")

 const steps=[
  {left:"31%",top:"54%"},
  {left:"42%",top:"51%"},
  {left:"52%",top:"48%"},
  {left:"62%",top:"45%"},
  {left:"71%",top:"42%"},
  {left:"82%",top:"29%"}
 ]

 let i=0

 function move(){
  if(i>=steps.length){
   show("РУДНЫЙ КАМЕНЬ ДОБЫТ","Открыта новая технология: ВЕРЁВКА")
   document.getElementById("hint").textContent="✓ Первая территория освоена"
   return
  }

  p.style.left=steps[i].left
  p.style.top=steps[i].top
  p.style.bottom="auto"
  i++
  setTimeout(move,700)
 }

 move()
}
</script>
</body>
</html>
