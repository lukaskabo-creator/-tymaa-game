<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TYMAA</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0b1512;
  color:#fff;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#17251c;
}

/* НАСТОЯЩАЯ КАРТА */

#world{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(
      to bottom,
      rgba(5,15,10,.06),
      rgba(5,15,10,.18)
    ),
    url("0B5ABD81-E33F-4E88-BD35-0051278A3EEF.png");

  background-size:cover;
  background-position:center;
  transform:scale(1.03);
}

/* CINEMATIC LIGHT */

#light{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(
      circle at 28% 18%,
      rgba(255,226,150,.18),
      transparent 30%
    ),
    linear-gradient(
      to bottom,
      rgba(0,0,0,.03),
      rgba(0,0,0,.30)
    );
}

/* TOP HUD */

#hud{
  position:absolute;
  top:0;
  left:0;
  right:0;
  padding:
    max(22px,env(safe-area-inset-top))
    22px
    18px;

  display:flex;
  justify-content:space-between;
  align-items:flex-start;

  background:
    linear-gradient(
      to bottom,
      rgba(5,12,8,.72),
      transparent
    );

  z-index:20;
}

.logo{
  font-family:Georgia,serif;
  letter-spacing:.20em;
  font-size:30px;
  color:#f0d08a;
  text-shadow:0 2px 15px rgba(0,0,0,.6);
}

.subtitle{
  margin-top:5px;
  font-size:11px;
  letter-spacing:.22em;
  color:rgba(255,244,210,.72);
}

.resources{
  display:flex;
  gap:8px;
}

.resource{
  padding:10px 13px;
  border-radius:18px;
  background:rgba(9,18,13,.72);
  border:1px solid rgba(240,208,138,.28);
  backdrop-filter:blur(12px);
  font-weight:700;
  box-shadow:0 6px 20px rgba(0,0,0,.2);
}

/* MISSION */

#mission{
  position:absolute;
  left:18px;
  top:125px;
  width:min(315px,72vw);

  padding:19px 20px;

  border-radius:20px;

  background:rgba(8,17,12,.79);
  border:1px solid rgba(240,208,138,.30);

  backdrop-filter:blur(16px);

  box-shadow:
    0 16px 45px rgba(0,0,0,.28);

  z-index:15;
}

.eyebrow{
  color:#e9c978;
  font-size:11px;
  letter-spacing:.22em;
  margin-bottom:9px;
}

#missionTitle{
  font-family:Georgia,serif;
  font-size:23px;
  line-height:1.12;
  margin-bottom:8px;
}

#missionText{
  color:rgba(255,247,225,.76);
  font-size:13px;
  line-height:1.45;
}

/* GAME OBJECTS */

.node{
  position:absolute;
  width:44px;
  height:44px;
  transform:translate(-50%,-50%);
  border-radius:50%;

  border:2px solid rgba(247,213,132,.95);

  background:
    radial-gradient(
      circle,
      rgba(255,218,130,.26) 0 28%,
      rgba(10,20,15,.76) 30%
    );

  box-shadow:
    0 0 0 7px rgba(245,207,116,.12),
    0 5px 16px rgba(0,0,0,.35);

  z-index:8;
}

.node.active{
  background:#e8bd60;
  box-shadow:
    0 0 0 9px rgba(245,207,116,.22),
    0 0 30px rgba(245,207,116,.55);
}

#n1{left:35%;top:60%}
#n2{left:43%;top:56%}
#n3{left:51%;top:52%}
#n4{left:59%;top:48%}
#n5{left:67%;top:44%}

/* BRIDGE */

.log{
  position:absolute;
  height:15px;
  transform-origin:left center;

  border-radius:20px;

  background:
    linear-gradient(
      #a46d35,
      #6e411e
    );

  box-shadow:
    0 5px 10px rgba(0,0,0,.35);

  z-index:6;
}

/* TARGET */

#target{
  position:absolute;
  left:77%;
  top:32%;

  width:58px;
  height:58px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  border:2px solid rgba(241,207,126,.8);

  box-shadow:
    0 0 0 10px rgba(239,202,112,.12),
    0 0 35px rgba(239,202,112,.24);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:27px;

  z-index:8;
}

/* CHARACTER */

#person{
  position:absolute;
  left:27%;
  top:73%;

  width:24px;
  height:42px;

  z-index:9;

  transition:
    left .7s cubic-bezier(.2,.8,.2,1),
    top .7s cubic-bezier(.2,.8,.2,1);
}

.head{
  width:15px;
  height:15px;
  border-radius:50%;
  background:#c99368;
  margin:auto;
}

.body{
  width:20px;
  height:29px;
  border-radius:9px 9px 5px 5px;
  background:#2b1b12;
  margin:-1px auto 0;
}

/* BOTTOM */

#bottom{
  position:absolute;
  bottom:max(20px,env(safe-area-inset-bottom));
  left:50%;
  transform:translateX(-50%);

  width:calc(100% - 36px);
  max-width:560px;

  z-index:25;
}

#message{
  margin:0 auto 11px;
  width:max-content;
  max-width:100%;

  padding:10px 16px;

  border-radius:20px;

  background:rgba(6,15,10,.80);
  border:1px solid rgba(240,208,138,.22);

  backdrop-filter:blur(12px);

  color:#f5e7c0;
  font-size:13px;

  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.controls{
  display:flex;
  gap:9px;
}

button{
  border:0;
  min-height:52px;
  border-radius:17px;

  font-size:14px;
  font-weight:800;
  letter-spacing:.06em;

  cursor:pointer;
}

#reset{
  width:58px;
  color:#f3e6c7;
  background:rgba(7,16,11,.88);
  border:1px solid rgba(240,208,138,.25);
}

#build{
  flex:1;
  color:#1e180d;

  background:
    linear-gradient(
      180deg,
      #f0cf7c,
      #c58a32
    );

  box-shadow:
    0 7px 22px rgba(0,0,0,.28);
}

#build:active{
  transform:scale(.98);
}

/* START SCREEN */

#intro{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      rgba(4,10,7,.30),
      rgba(4,10,7,.70)
    );

  backdrop-filter:blur(2px);

  z-index:100;
}

.introCard{
  width:min(88%,430px);
  padding:30px 25px;

  border-radius:27px;

  background:rgba(8,17,12,.84);
  border:1px solid rgba(240,208,138,.32);

  text-align:center;

  box-shadow:
    0 25px 80px rgba(0,0,0,.45);
}

.introLogo{
  font-family:Georgia,serif;
  color:#efd084;
  font-size:38px;
  letter-spacing:.22em;
}

.introTitle{
  font-family:Georgia,serif;
  font-size:25px;
  margin:22px 0 10px;
}

.introText{
  color:rgba(255,245,220,.72);
  font-size:14px;
  line-height:1.55;
  margin-bottom:23px;
}

#start{
  width:100%;
  background:linear-gradient(#f0d181,#c78c36);
  color:#20190c;
}

/* MOBILE */

@media(max-width:600px){

  .logo{font-size:25px}

  #mission{
    top:105px;
    width:67vw;
    padding:16px;
  }

  #missionTitle{
    font-size:19px;
  }

  #missionText{
    font-size:12px;
  }

  .node{
    width:37px;
    height:37px;
  }

}
</style>
</head>

<body>

<div id="game">

  <div id="world"></div>
  <div id="light"></div>

  <div id="hud">

    <div>
      <div class="logo">TYMAA</div>
      <div class="subtitle">АЛАС · ЛЕТО · ДЕНЬ 1</div>
    </div>

    <div class="resources">
      <div class="resource">🪵 <span id="wood">5</span></div>
      <div class="resource">👥 8</div>
    </div>

  </div>

  <div id="mission">

    <div class="eyebrow">ПЕРВАЯ ЭКСПЕДИЦИЯ</div>

    <div id="missionTitle">
      Перейди реку
    </div>

    <div id="missionText">
      Соедини пять опор и построй переправу к рудному берегу.
    </div>

  </div>

  <div id="target">⛏️</div>

  <div class="node" id="n1" data-i="0"></div>
  <div class="node" id="n2" data-i="1"></div>
  <div class="node" id="n3" data-i="2"></div>
  <div class="node" id="n4" data-i="3"></div>
  <div class="node" id="n5" data-i="4"></div>

  <div id="person">
    <div class="head"></div>
    <div class="body"></div>
  </div>

  <div id="bottom">

    <div id="message">
      Коснись первой опоры
    </div>

    <div class="controls">
      <button id="reset">↶</button>
      <button id="build">ПОСТРОИТЬ ПЕРЕПРАВУ</button>
    </div>

  </div>

  <div id="intro">

    <div class="introCard">

      <div class="introLogo">TYMAA</div>

      <div class="introTitle">
        Земля начинается с пути
      </div>

      <div class="introText">
        Перед тобой дикая территория.
        За рекой находится первый рудный камень.
        Построй переправу и открой путь поселению.
      </div>

      <button id="start">
        НАЧАТЬ ЭКСПЕДИЦИЮ
      </button>

    </div>

  </div>

</div>

<script>

const nodes=[...document.querySelectorAll(".node")];
const message=document.getElementById("message");
const wood=document.getElementById("wood");
const person=document.getElementById("person");

let selected=[];
let logs=[];
let resources=5;
let finished=false;

document.getElementById("start").onclick=()=>{
  document.getElementById("intro").style.display="none";
};

nodes.forEach((node,index)=>{

  node.addEventListener("click",()=>{

    if(finished) return;

    if(selected.includes(index)) return;

    if(index!==selected.length){
      message.textContent="Строй переправу по порядку";
      return;
    }

    node.classList.add("active");
    selected.push(index);

    if(selected.length===1){
      message.textContent="Хорошо. Теперь следующая опора.";
    }else{
      createLog(
        nodes[selected.length-2],
        node
      );

      resources--;
      wood.textContent=resources;

      message.textContent=
        selected.length<5
        ?"Продолжай строить переправу"
        :"Переправа готова. Испытай её.";
    }

  });

});

function createLog(a,b){

  const ar=a.getBoundingClientRect();
  const br=b.getBoundingClientRect();

  const game=document
    .getElementById("game")
    .getBoundingClientRect();

  const ax=ar.left+ar.width/2-game.left;
  const ay=ar.top+ar.height/2-game.top;

  const bx=br.left+br.width/2-game.left;
  const by=br.top+br.height/2-game.top;

  const dx=bx-ax;
  const dy=by-ay;

  const length=Math.sqrt(dx*dx+dy*dy);
  const angle=Math.atan2(dy,dx)*180/Math.PI;

  const log=document.createElement("div");

  log.className="log";

  log.style.left=ax+"px";
  log.style.top=(ay-7)+"px";
  log.style.width=length+"px";
  log.style.transform=`rotate(${angle}deg)`;

  document.getElementById("game").appendChild(log);

  logs.push(log);
}

document.getElementById("build").onclick=()=>{

  if(selected.length<5){
    message.textContent=
      "Сначала соедини все пять опор";
    return;
  }

  if(finished) return;

  finished=true;

  message.textContent=
    "Переправа выдержала. Экспедиция движется к руде.";

  const route=[
    [35,60],
    [43,56],
    [51,52],
    [59,48],
    [67,44],
    [77,32]
  ];

  route.forEach((p,i)=>{

    setTimeout(()=>{

      person.style.left=p[0]+"%";
      person.style.top=p[1]+"%";

      if(i===route.length-1){

        setTimeout(()=>{

          message.textContent=
            "✓ Новый берег открыт";

          document.getElementById("missionTitle")
            .textContent="Рудный берег";

          document.getElementById("missionText")
            .textContent=
            "Первая территория освоена. Здесь начнётся развитие поселения.";

        },600);

      }

    },i*720);

  });

};

document.getElementById("reset").onclick=()=>{

  selected=[];
  resources=5;
  finished=false;

  wood.textContent=resources;

  nodes.forEach(n=>n.classList.remove("active"));

  logs.forEach(l=>l.remove());
  logs=[];

  person.style.left="27%";
  person.style.top="73%";

  message.textContent="Коснись первой опоры";

  document.getElementById("missionTitle")
    .textContent="Перейди реку";

  document.getElementById("missionText")
    .textContent=
    "Соедини пять опор и построй переправу к рудному берегу.";

};

</script>

</body>
</html>
